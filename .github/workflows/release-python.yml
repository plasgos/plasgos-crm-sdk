name: release-python

# Publishes packages/python to PyPI when a tag like `python-v1.2.3` is pushed.
# Requirements (once):
#   - PyPI Trusted Publishing for project `plasgos-crm-sdk`: owner `plasgos`, repo `plasgos-crm-sdk`,
#     workflow `release-python.yml`, environment `pypi` (https://docs.pypi.org/trusted-publishers/).
#     No API token is stored in GitHub.
#   - GitHub environment `pypi` (Settings → Environments); add required reviewers to gate releases.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build twine
      - run: pytest -q
      - run: ruff check .
      - run: mypy src tests/test_v3_types.py tests/test_v3_async.py
      - name: Tipe sinkron dengan openapi-v3.json
        run: node ../../scripts/generate-types.mjs --check

      - name: Tag sama dengan versi paket
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          MODULE_VERSION="$(python -c "import plasgos_crm; print(plasgos_crm.__version__)")"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ] || [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME -> $TAG_VERSION, pyproject.toml $PROJECT_VERSION, __version__ $MODULE_VERSION" >&2
            exit 1
          fi

      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel terpasang bersih dan bisa diimpor
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import plasgos_crm as p; assert p.__version__ == '${GITHUB_REF_NAME#python-v}'; p.Client('a', 's'); p.AsyncClient('a', 's')"

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
