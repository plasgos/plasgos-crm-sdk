name: python

on:
  push:
    branches: [main]
    paths:
      - "packages/python/**"
      - "docs/vectors.json"
      - "docs/vectors-v3.json"
      - "openapi/openapi-v3.json"
      - "scripts/generate-types.mjs"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "packages/python/**"
      - "docs/vectors.json"
      - "docs/vectors-v3.json"
      - "openapi/openapi-v3.json"
      - "scripts/generate-types.mjs"
      - ".github/workflows/python.yml"

defaults:
  run:
    working-directory: packages/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - run: mypy src tests/test_v3_types.py
        if: ${{ matrix.python == '3.12' }}
      - name: Tipe sinkron dengan openapi-v3.json
        if: ${{ matrix.python == '3.12' }}
        run: node ../../scripts/generate-types.mjs --check
