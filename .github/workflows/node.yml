name: node

on:
  push:
    branches: [main]
    paths:
      - "packages/node/**"
      - "docs/vectors.json"
      - "docs/vectors-v3.json"
      - "openapi/openapi-v3.json"
      - "scripts/generate-types.mjs"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "packages/node/**"
      - "docs/vectors.json"
      - "docs/vectors-v3.json"
      - "openapi/openapi-v3.json"
      - "scripts/generate-types.mjs"
      - ".github/workflows/node.yml"

defaults:
  run:
    working-directory: packages/node

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci
      - name: Tipe sinkron dengan openapi-v3.json
        run: node ../../scripts/generate-types.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify CommonJS + ESM consumption
        run: node scripts/smoke-consume.mjs
