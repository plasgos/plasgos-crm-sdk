name: release-node

# Publishes packages/node to npm when a tag like `node-v1.2.3` is pushed.
# Requirements: npm Trusted Publishing for this repo + workflow (npmjs.com → package → Settings →
# Trusted Publisher: plasgos / plasgos-crm-sdk / release-node.yml). No token: npm classic tokens were
# revoked on 2025-12-09. Trusted publishing needs Node ≥ 22.14 and npm CLI ≥ 11.5.1.
on:
  push:
    tags: ["node-v*"]

permissions:
  contents: read
  id-token: write # trusted publishing (provenance is attached automatically)

defaults:
  run:
    working-directory: packages/node

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: npm CLI for trusted publishing (≥ 11.5.1)
        run: npm install -g npm@latest && npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify CommonJS + ESM consumption
        run: node scripts/smoke-consume.mjs

      - name: Tipe sinkron dengan openapi-v3.json
        run: node ../../scripts/generate-types.mjs --check

      - name: Verify tag matches package.json and SDK_VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#node-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SDK_VERSION="$(node -p "require('./dist/index.cjs').SDK_VERSION")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME -> $TAG_VERSION, package.json $PKG_VERSION, SDK_VERSION $SDK_VERSION" >&2
            exit 1
          fi

      - run: npm publish --access public
