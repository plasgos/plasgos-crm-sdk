[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasgos-crm-sdk"
version = "1.0.0"
description = "Official Python SDK for the Plasgos CRM Api Integration API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Plasgos" }]
keywords = ["plasgos", "crm", "whatsapp", "waba", "sdk", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://github.com/plasgos/plasgos-crm-sdk/tree/main/packages/python"
Source = "https://github.com/plasgos/plasgos-crm-sdk"

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/plasgos_crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
